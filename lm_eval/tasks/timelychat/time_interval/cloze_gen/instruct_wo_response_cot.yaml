task: time_interval_gen_instruct_wo_response_cot
include: ../cloze_generate_until_template_yaml
process_docs: !function utils.process_docs_instruct_without_gold_response_cot
doc_to_text: "{{query}}"
doc_to_target: "{{gold}}"
generation_kwargs:
  until:
    - "Q:"
    - "###"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
filter_list:
  - name: strict-match
    filter:
      - function: regex
        regex_pattern: '((?<=Therefore, the answer is )([A-D])|(?<=answer is )([A-D]))'
      - function: take_first
description: "You are given a conversation between two speakers. Your task is to predict the time interval until the next utterance based on the dialogue context. Your final answer should start with 'Therefore, the answer is ' followed by either A, B, C or D.\n\n### Dialogue context ###\nA: I finally got home. What a day!\nB: It's eleven p.m. and you just got back home? It must be very tough day today.\nA: Whooa Imma take a shower. I'm too tired.\nB: Wash out all your fatigue with it.\n\nQuestion: How much time is needed for A to respond?\nA. 1 day\nB. 20 minutes\nC. 30 seconds\nD. 8 hours\nAnswer: Let's think step by step. The ongoing event is taking a shower. A typical shower usually takes several minutes but not an excessively long time. Therefore, the answer is B.\n\n"